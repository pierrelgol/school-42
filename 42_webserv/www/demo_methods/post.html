<!DOCTYPE html>
<html>
<head>
    <title>POST Method</title>
</head>
<body>
    <h1>POST Method</h1>
    <p>This page demonstrates the POST HTTP method.</p>

    <!-- Form with username field (application/x-www-form-urlencoded) -->
    <h2>Form Submission (application/x-www-form-urlencoded)</h2>
    <form action="./post/user.txt" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <button type="submit">Submit</button>
    </form>

    <script>
        // Allow pressing Enter to submit the form
        document.getElementById('username').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevent default form behavior
                this.form.submit();     // Submit the form
            }
        });
    </script>

    <!-- Form with file upload (multipart/form-data) -->
    <h2>File Upload (multipart/form-data)</h2>
    <form action="./post/" method="POST" enctype="multipart/form-data">
        <label for="file">Choose a file:</label>
        <input type="file" id="file" name="file" required>
        <button type="submit">Upload</button>
    </form>
</body>
</html>
